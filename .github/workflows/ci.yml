name: "CI"

env:
  API_KEY_ALCHEMY: XXX
  FOUNDRY_PROFILE: "ci"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  lint:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out the repo"
        uses: "actions/checkout@v4"

      - name: "Install Foundry"
        uses: "foundry-rs/foundry-toolchain@v1"

      - name: "Install Bun"
        uses: "oven-sh/setup-bun@v1"

      - name: "Install the Node.js dependencies"
        run: "bun install"

      - name: "Lint the code"
        run: "bun run lint"

      - name: "Add lint summary"
        run: |
          echo "## Lint result" >> $GITHUB_STEP_SUMMARY
          echo "✅ Passed" >> $GITHUB_STEP_SUMMARY

  build:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out the repo"
        uses: "actions/checkout@v4"

      - name: "Install Foundry"
        uses: "foundry-rs/foundry-toolchain@v1"

      - name: "Install Bun"
        uses: "oven-sh/setup-bun@v1"

      - name: "Install the Node.js dependencies"
        run: "bun install"

      - name: "Build the contracts and print their size"
        run: "forge build --sizes"

      - name: "Add build summary"
        run: |
          echo "## Build result" >> $GITHUB_STEP_SUMMARY
          echo "✅ Passed" >> $GITHUB_STEP_SUMMARY

  security:
    needs: ["build"]
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out the repo"
        uses: "actions/checkout@v4"

      - name: "Install Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.11"

      - name: "Install Slither"
        run: pip3 install slither-analyzer

      - name: "Install Foundry"
        uses: "foundry-rs/foundry-toolchain@v1"

      - name: "Install Bun"
        uses: "oven-sh/setup-bun@v1"

      - name: "Install the Node.js dependencies"
        run: "bun install"

      - name: "Run Slither"
        run: |
          slither . --json slither-report.json 2>&1 | tee slither-output.txt || true

      - name: "Check for high/medium severity issues"
        run: |
          # Parse results and fail on high severity
          HIGH=$(cat slither-report.json | jq '[.results.detectors[] | select(.impact == "High")] | length')
          MEDIUM=$(cat slither-report.json | jq '[.results.detectors[] | select(.impact == "Medium")] | length')
          echo "High severity issues: $HIGH"
          echo "Medium severity issues: $MEDIUM"
          echo "## Slither Security Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- High severity: $HIGH" >> $GITHUB_STEP_SUMMARY
          echo "- Medium severity: $MEDIUM" >> $GITHUB_STEP_SUMMARY
          if [ "$HIGH" -gt 0 ]; then
            echo "❌ Found $HIGH high severity issues!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ No high severity issues found" >> $GITHUB_STEP_SUMMARY

      - name: "Upload Slither Report"
        uses: "actions/upload-artifact@v4"
        if: always()
        with:
          name: slither-report
          path: |
            slither-report.json
            slither-output.txt

  test:
    needs: ["lint", "build"]
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out the repo"
        uses: "actions/checkout@v4"

      - name: "Install Foundry"
        uses: "foundry-rs/foundry-toolchain@v1"

      - name: "Install Bun"
        uses: "oven-sh/setup-bun@v1"

      - name: "Install the Node.js dependencies"
        run: "bun install"

      - name: "Show the Foundry config"
        run: "forge config"

      - name: "Generate a fuzz seed that changes weekly to avoid burning through RPC allowance"
        run: >
          echo "FOUNDRY_FUZZ_SEED=$(
            echo $(($EPOCHSECONDS - $EPOCHSECONDS % 604800))
          )" >> $GITHUB_ENV

      - name: "Run the tests"
        run: "forge test"

      - name: "Add test summary"
        run: |
          echo "## Tests result" >> $GITHUB_STEP_SUMMARY
          echo "✅ Passed" >> $GITHUB_STEP_SUMMARY

  fork-test:
    runs-on: "ubuntu-latest"
    env:
      MAINNET_RPC_URL: "${{ secrets.MAINNET_RPC_URL || 'https://mainnet.gateway.tenderly.co' }}"
      FOUNDRY_PROFILE: "fork"
    steps:
      - name: "Check out the repo"
        uses: "actions/checkout@v4"

      - name: "Install Foundry"
        uses: "foundry-rs/foundry-toolchain@v1"

      - name: "Install Bun"
        uses: "oven-sh/setup-bun@v1"

      - name: "Install the Node.js dependencies"
        run: "bun install"

      - name: "Run the risk-oracle fork tests"
        run: "forge test --match-path 'tests/risk-oracles/script/**' -vv"
